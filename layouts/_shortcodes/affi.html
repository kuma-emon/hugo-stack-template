{{- $id := .Get "id" | string -}}
{{- $mapping := index hugo.Data "affi-mapping" -}}
{{- $entry := index $mapping $id -}}
{{- if $entry -}}
{{- $url := partial "helper/amazon-tag-url" (dict "url" $entry.url "tag" .Site.Params.amazonTag) -}}
<a href="{{ $url }}" target="_blank" rel="noopener" class="link affi-link">{{ $entry.text }}</a>
{{- else -}}
<!-- affi id={{ $id }} not found -->
{{- end -}}
